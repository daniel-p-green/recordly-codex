name: Bug report
description: Report a reproducible problem in Recordly Codex.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Recordly Codex. Do not include credentials, private URLs, recordings, or other sensitive data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
      placeholder: I expected ... but instead ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest set of steps, including a safe public URL if applicable.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the plugin version, package version, or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Codex desktop app
        - Codex CLI
        - CI
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe diagnostic output
      description: Paste sanitized logs or attach a redacted screenshot. Remove tokens, cookies, personal data, and private URLs.
