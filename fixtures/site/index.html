<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recordly Codex Local Demo</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #0f172a; color: #0f172a; }
      main { width: 100%; min-height: 900px; padding: 96px 128px; background: linear-gradient(140deg, #e0f2fe, #f8fafc 55%, #dbeafe); }
      section { width: 900px; padding: 56px; border: 1px solid #cbd5e1; border-radius: 24px; background: #fff; box-shadow: 0 28px 70px rgb(15 23 42 / 18%); }
      .eyebrow { margin: 0 0 16px; color: #0369a1; font-size: 18px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 56px; line-height: 1.05; }
      .summary { max-width: 650px; margin: 24px 0 36px; color: #475569; font-size: 24px; line-height: 1.5; }
      button { border: 0; border-radius: 12px; padding: 16px 24px; background: #2563eb; color: #fff; font: inherit; font-size: 20px; font-weight: 700; cursor: pointer; }
      button:hover { background: #1d4ed8; }
      button:focus-visible { outline: 4px solid #7dd3fc; outline-offset: 4px; }
      #result { display: none; margin-top: 36px; padding: 24px; border-radius: 16px; background: #ecfdf5; color: #065f46; }
      #result[data-state="complete"] { display: block; }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="demo-title">
        <p class="eyebrow">Local deterministic demo</p>
        <h1 id="demo-title">Turn a browser step into recorded evidence.</h1>
        <p class="summary">This static fixture has no network dependencies and exposes one visible, repeatable result state.</p>
        <button id="run-demo" type="button">Generate result</button>
        <div id="result" role="status" aria-live="polite" data-state="idle">
          <strong>Result ready.</strong>
          <span id="result-detail">The deterministic local action completed.</span>
        </div>
      </section>
    </main>
    <script>
      document.querySelector("#run-demo").addEventListener("click", () => {
        const result = document.querySelector("#result");
        result.dataset.state = "complete";
      });
    </script>
  </body>
</html>
